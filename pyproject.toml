[project]
name = "n1drill"
version = "0.1.0"
description = "Simulates Kubernetes node loss and drain scenarios to surface scheduling findings before they happen in production."
readme = "README.md"
license = "MIT"
authors = [
    { name = "omerkisa1", email = "omereis.5555@gmail.com" }
]
requires-python = ">=3.10"
keywords = ["kubernetes", "scheduling", "chaos-engineering", "capacity-planning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Clustering",
]
dependencies = [
    "kubernetes>=36.0.3",
    "rich>=13.8",
    "typer>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF", "ARG", "PTH"]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]
