---
- name: 0a035 - fetch rke2 kubeconfig to the dev machine
  ansible.builtin.fetch:
    src: /etc/rancher/rke2/rke2.yaml
    dest: "{{ lookup('env', 'HOME') }}/.kube/n1drill-lab.yaml"
    flat: true
  tags: ["0a035"]

- name: 0a036 - point the local kubeconfig at the real server IP
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/n1drill-lab.yaml"
    regexp: "127\\.0\\.0\\.1"
    replace: "{{ ansible_host }}"
  delegate_to: localhost
  tags: ["0a036"]

- name: 0a037 - restrict kubeconfig permissions
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.kube/n1drill-lab.yaml"
    mode: "0600"
  delegate_to: localhost
  tags: ["0a037"]

# RKE2 ships this file with a single "default" cluster/context/user - renaming
# all three to n1drill-lab keeps it from colliding with other clusters later.
- name: 0a037 - rename the default context to n1drill-lab
  ansible.builtin.replace:
    path: "{{ lookup('env', 'HOME') }}/.kube/n1drill-lab.yaml"
    regexp: "\\bdefault\\b"
    replace: "n1drill-lab"
  delegate_to: localhost
  tags: ["0a037"]

- name: 0a038 - verify access to all 4 nodes from the dev machine
  ansible.builtin.command: >
    kubectl --kubeconfig {{ lookup('env', 'HOME') }}/.kube/n1drill-lab.yaml get nodes -o name
  delegate_to: localhost
  register: n1drill_local_nodes
  changed_when: false
  failed_when: n1drill_local_nodes.stdout_lines | length != groups['rke2'] | length
  tags: ["0a038"]
