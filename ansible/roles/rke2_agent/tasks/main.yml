---
- name: 0a027 - install rke2 agent
  ansible.builtin.shell: curl -sfL https://get.rke2.io | INSTALL_RKE2_TYPE="agent" sh -
  args:
    creates: /usr/local/bin/rke2
  tags: ["0a027"]

- name: 0a028 - create rancher config directory
  ansible.builtin.file:
    path: /etc/rancher/rke2
    state: directory
    mode: "0755"
  tags: ["0a028"]

- name: 0a028 - write rke2 agent config
  ansible.builtin.copy:
    dest: /etc/rancher/rke2/config.yaml
    content: |
      server: https://{{ hostvars[groups['server'][0]].ansible_host }}:9345
      token: {{ hostvars[groups['server'][0]].n1drill_token }}
      node-label:
        - "n1drill.io/size={{ node_size }}"
    mode: "0600"
  notify: restart rke2-agent
  tags: ["0a028"]

# Runs once per host in the `workers` group, so worker-1, worker-2, and
# worker-3 all get enabled/started in the same play - no need to repeat
# per-node commands like the old scripts/rke2-setup/bootstrap-agent.sh did.
- name: 0a029 - enable and start rke2-agent
  ansible.builtin.systemd:
    name: rke2-agent
    enabled: true
    state: started
  tags: ["0a029", "0a030", "0a031"]

