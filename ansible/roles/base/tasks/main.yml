---
- name: 0a013 - sync /etc/hosts across all lab nodes
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} n1drill lab hosts"
    block: |
      {% for host in groups['rke2'] %}
      {{ hostvars[host].ansible_host }} {{ host }}
      {% endfor %}
  tags: ["0a013"]

- name: 0a015 - refresh apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  tags: ["0a015"]

- name: 0a016 - turn off swap right now
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true
  tags: ["0a016"]

- name: 0a016 - comment out swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
  tags: ["0a016"]

- name: 0a017 - load overlay and br_netfilter at every boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
  tags: ["0a017"]

- name: 0a017 - load kernel modules right now
  ansible.builtin.command: modprobe {{ item }}
  loop:
    - overlay
    - br_netfilter
  changed_when: false
  tags: ["0a017"]

- name: 0a018 - write kubernetes network sysctl settings
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward = 1
  tags: ["0a018"]

- name: 0a018 - apply sysctl settings
  ansible.builtin.command: sysctl --system
  changed_when: false
  tags: ["0a018"]
