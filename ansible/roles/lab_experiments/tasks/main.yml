---
# All kubectl calls in this role run from the dev machine against the
# kubeconfig local_kubeconfig produced, not on n1-server itself.

- name: set the path to the local kubeconfig
  ansible.builtin.set_fact:
    n1drill_kubeconfig: "{{ lookup('env', 'HOME') }}/.kube/n1drill-lab.yaml"
  tags: ["0b012", "0b018", "0b019", "0b020", "0b021", "0b022", "0b023"]

- name: 0b012 - taint n1-worker-3 for the dedicated-db scenario
  ansible.builtin.command: >
    kubectl --kubeconfig {{ n1drill_kubeconfig }}
    taint node n1-worker-3 n1drill.io/dedicated=db:NoSchedule --overwrite
  delegate_to: localhost
  changed_when: true
  tags: ["0b012"]

- name: 0b018 - apply all experiment workloads
  ansible.builtin.command: >
    kubectl --kubeconfig {{ n1drill_kubeconfig }}
    apply -f {{ playbook_dir }}/../experiments/
  delegate_to: localhost
  changed_when: true
  tags: ["0b018"]

# Only unschedulable-selector (0B.011) and fragmentation-probe (0B.015) are
# meant to be Pending. Anything else stuck here means the lab capacity plan
# in docs/lab.md doesn't match reality - fix the node sizing, not this check.
- name: 0b019 - verify only the two intentionally-unschedulable pods are Pending
  ansible.builtin.command: >
    kubectl --kubeconfig {{ n1drill_kubeconfig }}
    -n n1drill-lab get pods -o jsonpath={range .items[?(@.status.phase=="Pending")]}{.metadata.name}{"\n"}{end}
  delegate_to: localhost
  register: n1drill_pending_pods
  changed_when: false
  failed_when: >
    (n1drill_pending_pods.stdout_lines | sort) !=
    (['fragmentation-probe', 'unschedulable-selector'] | sort)
  tags: ["0b019"]

# These two are the first real fixtures - Faz 2's mapper tests run against
# them, so they need to represent the actual lab state, not a toy cluster.
- name: 0b020 - dump all nodes to a fixture file
  ansible.builtin.shell: >
    kubectl --kubeconfig {{ n1drill_kubeconfig }}
    get nodes -o yaml > {{ playbook_dir }}/../tests/fixtures/live/nodes.yaml
  delegate_to: localhost
  changed_when: true
  tags: ["0b020"]

- name: 0b021 - dump all pods across all namespaces to a fixture file
  ansible.builtin.shell: >
    kubectl --kubeconfig {{ n1drill_kubeconfig }}
    get pods -A -o yaml > {{ playbook_dir }}/../tests/fixtures/live/pods.yaml
  delegate_to: localhost
  changed_when: true
  tags: ["0b021"]

- name: 0b022 - dump pvcs, pvs, and storageclasses to fixture files
  ansible.builtin.shell: >
    kubectl --kubeconfig {{ n1drill_kubeconfig }}
    get {{ item }} -A -o yaml > {{ playbook_dir }}/../tests/fixtures/live/{{ item }}s.yaml
  loop:
    - pvc
    - pv
    - sc
  delegate_to: localhost
  changed_when: true
  tags: ["0b022"]

# status.disruptionsAllowed is what Faz 7's own calculation gets checked
# against, so this fixture has to be captured after 0B.018 applies both PDBs.
- name: 0b023 - dump pod disruption budgets to a fixture file
  ansible.builtin.shell: >
    kubectl --kubeconfig {{ n1drill_kubeconfig }}
    get pdb -A -o yaml > {{ playbook_dir }}/../tests/fixtures/live/pdbs.yaml
  delegate_to: localhost
  changed_when: true
  tags: ["0b023"]

- name: 0b024 - strip managedFields and check for leaked secrets
  ansible.builtin.command: "{{ playbook_dir }}/../scripts/experiments/clean-fixtures.sh"
  delegate_to: localhost
  changed_when: true
  tags: ["0b024"]
