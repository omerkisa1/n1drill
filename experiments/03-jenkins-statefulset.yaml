# The case project-base.md calls out specifically: a StatefulSet with a
# local-path PVC. Once the PV binds, it carries a nodeAffinity pinning it to
# whichever node provisioned it - the pod can never schedule anywhere else,
# no matter how much free capacity exists elsewhere (see 0B.006).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jenkins
  namespace: n1drill-lab
spec:
  serviceName: jenkins
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      containers:
        - name: jenkins
          image: nginx:1.27
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: jenkins-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: jenkins-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
